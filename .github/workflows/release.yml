name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build release binary
        run: swift build -c release --arch arm64
      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/arm64-apple-macosx/release/helix-theme-sync dist/helix-theme-sync
          tar -C dist -czf helix-theme-sync-macos-arm64.tar.gz helix-theme-sync
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" helix-theme-sync-macos-arm64.tar.gz --generate-notes
