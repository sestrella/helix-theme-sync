name: actionlint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/*
  push:
    branches:
      - main
    paths:
      - .github/workflows/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Run actionlint
        run: nix develop --no-pure-eval --command actionlint
