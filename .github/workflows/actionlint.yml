name: actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/*
  push:
    branches: [main]
    paths:
      - .github/workflows/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install and run actionlint
        uses: devops-actions/actionlint@v0.1.12
